name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server with Dynamic AWS SG Whitelisting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Get GitHub Runner Public IP
        id: ip
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          echo "Detected Runner Public IP: ${RUNNER_IP}"

      - name: Temporarily Whitelist Runner IP in AWS Security Group
        run: |
          echo "Authorizing IP ${{ steps.ip.outputs.runner_ip }} on port ${{ secrets.SERVER_PORT || 22 }} in Security Group ${{ secrets.AWS_SECURITY_GROUP_ID }}..."
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port ${{ secrets.SERVER_PORT || 22 }} \
            --cidr "${{ steps.ip.outputs.runner_ip }}/32"

      - name: Execute Deployment on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          request_pty: true
          envs: SERVER_PASSWORD
          script: |
            set -e

            # Helper function to run commands with sudo using non-interactive password
            SUDO() {
              echo "$SERVER_PASSWORD" | sudo -S "$@"
            }

            echo "=========================================================="
            echo "🚀 [1/4] Synchronizing Repository to /apps/docker/ai-trade"
            echo "=========================================================="
            SUDO mkdir -p /apps/docker/ai-trade
            SUDO chown -R $USER:$USER /apps/docker/ai-trade

            cd /apps/docker/ai-trade
            if [ -d ".git" ]; then
              git fetch https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
              git reset --hard FETCH_HEAD
            else
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            fi

            echo "=========================================================="
            echo "🎨 [2/4] Building Frontend in /apps/docker/ai-trade/frontend"
            echo "=========================================================="
            cd /apps/docker/ai-trade/frontend

            # Load .env from backup location
            if [ -f "/opt/ai-bkp/19-09-26/frontend/.env" ]; then
              echo "📄 Copying frontend .env from /opt/ai-bkp/19-09-26/frontend/.env..."
              cp /opt/ai-bkp/19-09-26/frontend/.env /apps/docker/ai-trade/frontend/.env
            else
              echo "⚠️ /opt/ai-bkp/19-09-26/frontend/.env not found, using existing .env if present"
            fi

            npm ci
            npm run build

            echo "📁 Copying dist to /usr/share/nginx/html/ai-trade/..."
            SUDO mkdir -p /usr/share/nginx/html/ai-trade/
            SUDO cp -r /apps/docker/ai-trade/frontend/dist/* /usr/share/nginx/html/ai-trade/

            echo "=========================================================="
            echo "📦 [3/4] Building Backend in /apps/docker/ai-trade/backend"
            echo "=========================================================="
            cd /apps/docker/ai-trade/backend

            # Load .env from backup location
            if [ -f "/opt/ai-bkp/19-09-26/backend/.env" ]; then
              echo "📄 Copying backend .env from /opt/ai-bkp/19-09-26/backend/.env..."
              cp /opt/ai-bkp/19-09-26/backend/.env /apps/docker/ai-trade/backend/.env
              if [ -d "/apps/docker/ai-trade/backend/arbitrage" ]; then
                cp /opt/ai-bkp/19-09-26/backend/.env /apps/docker/ai-trade/backend/arbitrage/.env || true
              fi
            else
              echo "⚠️ /opt/ai-bkp/19-09-26/backend/.env not found, using existing .env if present"
            fi

            npm ci --production=false
            npx prisma generate
            npm run build:bots || true
            npm run build:arbitrage || true

            # Ensure logging directories exist with write permissions
            SUDO mkdir -p /var/log/ai-bdm /var/log/ai-trade
            SUDO chmod -R 777 /var/log/ai-bdm /var/log/ai-trade || true

            # Fix file permissions and ownership for systemd access
            echo "🔑 Ensuring proper permissions on /apps/docker/ai-trade..."
            SUDO chmod -R 755 /apps/docker/ai-trade
            if [ -f "/apps/docker/ai-trade/backend/.env" ]; then
              SUDO chmod 644 /apps/docker/ai-trade/backend/.env
            fi
            if [ -f "/apps/docker/ai-trade/frontend/.env" ]; then
              SUDO chmod 644 /apps/docker/ai-trade/frontend/.env
            fi
            if [ -f "/apps/docker/ai-trade/backend/arbitrage/.env" ]; then
              SUDO chmod 644 /apps/docker/ai-trade/backend/arbitrage/.env
            fi

            # Align ownership with service user if specified in systemd unit
            SVC_USER=$(SUDO systemctl show -p User ai-backend.service 2>/dev/null | cut -d= -f2 || true)
            if [ -n "$SVC_USER" ] && [ "$SVC_USER" != "root" ] && [ "$SVC_USER" != "" ]; then
              echo "Setting backend directory ownership for service user: $SVC_USER"
              SUDO chown -R $SVC_USER:$SVC_USER /apps/docker/ai-trade/backend || true
            fi

            # Restore SELinux security context on RHEL/CentOS systems
            if command -v restorecon >/dev/null 2>&1; then
              SUDO restorecon -R /apps/docker/ai-trade || true
            fi

            echo "=========================================================="
            echo "🔄 [4/4] Restarting ai-backend.service"
            echo "=========================================================="
            SUDO systemctl daemon-reload
            SUDO systemctl reset-failed ai-backend.service || true

            # Restart service with diagnostic capture and fallback recovery
            if ! SUDO systemctl restart ai-backend.service; then
              echo "⚠️ Initial systemctl restart failed. Fetching journalctl logs..."
              SUDO journalctl -xeu ai-backend.service --no-pager -n 50 || true
              SUDO systemctl status ai-backend.service --no-pager || true

              echo "🧹 Attempting cleanup of any stale node processes..."
              SUDO pkill -f "node server.js" || true
              sleep 2
              SUDO systemctl reset-failed ai-backend.service || true
              SUDO systemctl restart ai-backend.service
            fi

            SUDO systemctl status ai-backend.service --no-pager -n 15

            echo "=========================================================="
            echo "✅ Deployment Successfully Completed!"
            echo "=========================================================="

      - name: Revoke Runner IP from AWS Security Group
        if: always()
        run: |
          if [ -n "${{ steps.ip.outputs.runner_ip }}" ]; then
            echo "Revoking IP ${{ steps.ip.outputs.runner_ip }} from Security Group ${{ secrets.AWS_SECURITY_GROUP_ID }}..."
            aws ec2 revoke-security-group-ingress \
              --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
              --protocol tcp \
              --port ${{ secrets.SERVER_PORT || 22 }} \
              --cidr "${{ steps.ip.outputs.runner_ip }}/32" || true
            echo "Security Group ingress rule revoked successfully."
          fi
